services:
  nginx:
    image: nginx:1.23
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    command: '/bin/sh -c ''while :; do sleep 720h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
  certbot:
    container_name: my-certbot
    image: certbot/dns-nsone:v2.11.0
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  db-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=HustEt3260
      - MYSQL_ROOT_PASSWORD=12102005
    ports:
      - "3310:3306"
    expose:
      - "3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./initDB.sql:/docker-entrypoint-initdb.d/init.sql
  ## Using a host bind-mount for Elasticsearch data
  # Host path: ../elk-data -> will be mounted to /usr/share/elasticsearch/data
  # rest-password: docker exec -it <tên_hoặc_id_container> /usr/share/elasticsearch/bin/elasticsearch-reset-password -u elastic
  # new pass: 2ryVa4TX4VhYg*Xuup41
  #kể từ phiên bản Elasticsearch 8.0 trở đi, các tính năng bảo mật đã được tự động kích hoạt theo mặc định.
  #cờ -k (hoặc --insecure) để bảo curl lờ đi việc chứng chỉ không an toàn, và thêm thông tin tài khoản
  #vd: curl -k -u elastic:2ryVa4TX4VhYg*Xuup41 https://localhost:9200
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=datasearch
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.initial_master_nodes=elasticsearch
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - ../elk-data:/usr/share/elasticsearch/data
  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.8
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

  backend-spring:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/HustEt3260
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=12102005
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - HIEUPAHM_UPLOAD_FILE_BASE_URI=file:///uploads/
    depends_on:
      - db-mysql
    volumes:
      - ../docker-storage/:/uploads/
#run command: docker compose -p emr-restful-project up -d
#Chạy lệnh docker compose up -d --build để apply cấu hình mới và build lại backend.
